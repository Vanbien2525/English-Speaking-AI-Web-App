[project]
name = "speaking-tutor-ai-engine"
version = "0.1.0"
description = "Hybrid Phoneme-level Pronunciation Assessment & 3D Viseme Controller Service (WhisperX + Wav2Vec2 + Llama 3.1 / Cloud Adapters)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.19",
  "edge-tts>=7.0.0",
  "numpy>=2.0.0",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
local-ml = [
  "torch>=2.5.0",
  "torchaudio>=2.5.0",
  "transformers>=4.46.0",
  "whisperx>=3.2.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
